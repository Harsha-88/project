syntax = "proto3";

package user;

service UserService {
  rpc CreateUser (CreateUserRequest) returns (UserResponse);
  rpc FindUserByEmail (FindUserByEmailRequest) returns (UserResponse);
}

message CreateUserRequest {
  string email = 1;
  string password = 2;
}

message FindUserByEmailRequest {
  string email = 1;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string password = 3;
  string createdAt = 4;
}
